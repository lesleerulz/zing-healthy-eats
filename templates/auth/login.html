{% extends "base.html" %}
{% block content %}
<div class="row g-0 rounded shadow overflow-hidden" style="min-height: 80vh;">
    <!-- Left Side: Login Form -->
    <div class="col-lg-6 bg-white d-flex align-items-center justify-content-center p-5">
        <div class="w-100" style="max-width: 400px;">
            <div class="text-center mb-5">
                <img src="{{ url_for('static', filename='images/logo_blue.png') }}" alt="Zing Healthy Treats"
                    class="img-fluid mb-3" style="max-height: 80px;">
                <h2 class="h4 text-muted">Welcome Back!</h2>
            </div>

            <form method="post">
                <div class="mb-3">
                    <label class="form-label" style="color: #E1AD01;">Username or Email:</label>
                    <input class="form-control form-control-lg" type="text" name="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password" style="color: #E1AD01;">Password:</label>
                    <div class="input-group">
                        <input class="form-control form-control-lg" type="password" name="password" id="password"
                            required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid gap-2 mb-4">
                    <button class="btn btn-primary btn-lg" type="submit">Login</button>
                    <div class="text-center my-3 text-muted">OR</div>
                    <a href="{{ url_for('auth.google_login') }}"
                        class="btn btn-lg btn-outline-dark d-flex align-items-center justify-content-center gap-2">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="24px"
                            height="24px">
                            <path fill="#EA4335"
                                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
                            </path>
                            <path fill="#4285F4"
                                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
                            </path>
                            <path fill="#FBBC05"
                                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
                            </path>
                            <path fill="#34A853"
                                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
                            </path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                        Sign in with Google
                    </a>
                </div>

                <script>
                    const togglePassword = document.querySelector('#togglePassword');
                    const passwordInput = document.querySelector('#password');

                    togglePassword.addEventListener('click', function () {
                        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                        passwordInput.setAttribute('type', type);

                        this.querySelector('i').classList.toggle('bi-eye');
                        this.querySelector('i').classList.toggle('bi-eye-slash');
                    });
                </script>
                <!-- Links -->
            <div class="mt-4 text-center">
                <p class="small text-muted mb-1">
                    Forgot your password? <a href="{{ url_for('auth.reset_request') }}" class="text-warning text-decoration-none border-bottom border-warning">Reset Password</a>
                </p>
                <p class="small text-muted mb-0">
                    Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-warning text-decoration-none border-bottom border-warning">Sign Up</a>
                </p>
            </div>
            </form>
        </div>
    </div>

    <!-- Right Side: Brand Image/Color -->
    <div class="col-lg-6 d-none d-lg-block bg-primary position-relative overflow-hidden">
        <!-- Optional: Background Pattern or Image -->
        <div class="position-absolute top-50 start-50 translate-middle text-center text-zing-blue px-5">
            <div id="lottie-login-large" style="width: 300px; height: 300px; margin: 0 auto;"></div>
            <h1 class="display-3 fw-bold mb-4">Healthy Treats, Healthy You.</h1>
            <p class="lead">Experience the best healthy snacks in Nairobi.</p>
        </div>
    </div>
</div>
{% endblock %}
