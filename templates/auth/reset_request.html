{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow">
            <div class="p-4 card-body text-center">
                <h2 class="mb-3 card-title">Reset Password</h2>
                <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                
                <form method="post">
                    <div class="mb-4 text-start">
                        <label class="form-label" style="color: #E1AD01;">Email Address:</label>
                        <input class="form-control form-control-lg" type="email" name="email" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-primary btn-lg" type="submit">Send Reset Link</button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-link">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
