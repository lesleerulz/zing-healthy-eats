<div id="addProductModal" class="modal fade " tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addProductModalLabel">Add prodduct</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <form method="post" action="{{ url_for('add_product') }}" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name:</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea name="description" class="form-control" rows="8" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category:</label>
                        <select name="category_id" class="form-select">
                            <option value="">Select a category</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Unit price (KES):</label>
                        <div class="input-group">
                            <span class="input-group-text">KES</span>
                            <input type="number" step="0.01" name="price" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Original Price (for discounts):</label>
                        <div class="input-group">
                            <span class="input-group-text">KES</span>
                            <input type="number" step="0.01" name="original_price" class="form-control" placeholder="Optional">
                        </div>
                        <div class="form-text">Leave empty if there is no discount.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity:</label>
                        <input type="number" name="quantity" class="form-control" required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Product images (Select multiple):</label>
                        <input type="file" name="image" class="form-control" accept="image/*" multiple>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isPeoplesChoice" name="is_peoples_choice">
                        <label class="form-check-label" for="isPeoplesChoice">Add to {{ sale_page_title }}</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-success">Add product</button>
                </div>
            </form>
        </div>
    </div>
</div>
