{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Driver View: Delivering Order #{{ order.id }}</h2>
    <p class="text-muted">Broadcasting your location to the client. Keep this window open.</p>
    <div id="map" class="mt-3" style="height: 500px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
<script>
    const socket = io();
    const orderId = {{ order.id }};
    
    // Join tracking room
    socket.emit('join_tracking_room', { order_id: orderId });

    // Initialize map
    var map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    var marker = null;
    var pathLine = null;
    var pathCoordinates = [];

    // Add customer delivery destination marker if available
    {% if order.delivery_lat and order.delivery_lng %}
    var destLat = {{ order.delivery_lat }};
    var destLng = {{ order.delivery_lng }};
    
    // Create custom red icon for destination
    var redIcon = new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    var destMarker = L.marker([destLat, destLng], {icon: redIcon}).addTo(map)
        .bindPopup("<b>Delivery Destination</b>");
        
    // Initially center the map on the customer's destination in case driver GPS takes a while
    map.setView([destLat, destLng], 14);
        
    // Add Google Maps and Waze navigation buttons above the map
    var mapContainer = document.getElementById('map');
    var navHtml = `
        <div class="alert alert-info py-2 d-flex justify-content-between align-items-center mb-2">
            <span><strong>Destination Coordinates set by customer.</strong></span>
            <div class="d-flex gap-2">
                <a href="https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}" target="_blank" class="btn btn-sm btn-primary">
                    <i class="bi bi-google me-1"></i>Google Maps
                </a>
                <a href="https://waze.com/ul?ll=${destLat},${destLng}&navigate=yes" target="_blank" class="btn btn-sm btn-info text-white" style="background-color: #33ccff; border-color: #33ccff;">
                    <i class="bi bi-cursor-fill me-1"></i>Waze
                </a>
            </div>
        </div>
    `;
    mapContainer.insertAdjacentHTML('beforebegin', navHtml);
    {% endif %}

    function updateLocation(position) {
        var lat = position.coords.latitude;
        var lon = position.coords.longitude;
        
        socket.emit('driver_location_update', {
            order_id: orderId,
            lat: lat,
            lng: lon
        });

        pathCoordinates.push([lat, lon]);

        if (!marker) {
            marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
            
            // If we have a destination, fit bounds to show both
            {% if order.delivery_lat and order.delivery_lng %}
                var bounds = L.latLngBounds([lat, lon], [destLat, destLng]);
                map.fitBounds(bounds, {padding: [50, 50]});
            {% else %}
                map.setView([lat, lon], 16);
            {% endif %}
        } else {
            marker.setLatLng([lat, lon]);
        }

        if (!pathLine) {
            pathLine = L.polyline(pathCoordinates, { color: '#0d6efd', weight: 4 }).addTo(map);
        } else {
            pathLine.setLatLngs(pathCoordinates);
        }
    }

    function handleLocationError(error) {
        console.error("Location error:", error);
    }

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(updateLocation, handleLocationError, {
            enableHighAccuracy: true,
            maximumAge: 0
        });
    } else {
        alert("Geolocation not supported by your browser.");
    }
</script>
{% endblock %}
