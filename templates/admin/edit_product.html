<div id="editProductModal-{{ product.id }}" class="modal fade" tabindex="-1"
    aria-labelledby="editProductModalLabel-{{ product.id }}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editProductModalLabel-{{ product.id }}">Edit product</h5>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <form method="post" action="{{ url_for('edit_product', product_id=product.id) }}"
                enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name:</label>
                        <input type="text" name="title" class="form-control" value="{{ product.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description:</label>
                        <textarea name="description" class="form-control" rows="8"
                            required>{{ product.description }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category:</label>
                        <select name="category_id" class="form-select">
                            <option value="">Select a category</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}" {% if product.category_id==category.id %}selected{% endif
                                %}>{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Unit price (KES):</label>
                        <div class="input-group">
                            <span class="input-group-text">KES</span>
                            <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price }}"
                                required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantity:</label>
                        <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}"
                            required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Add/Update images (Select multiple):</label>
                        <input type="file" name="image" class="form-control" accept="image/*" multiple>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isPeoplesChoice-{{ product.id }}"
                            name="is_peoples_choice" {% if product.is_peoples_choice %}checked{% endif %}>
                        <label class="form-check-label" for="isPeoplesChoice-{{ product.id }}">Add to {{ sale_page_title
                            }}</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Update product</button>
                </div>
            </form>
        </div>
    </div>
</div>
